<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Returning to Obsidian - harang-contacts</title>
    <script type="text/javascript">
      window.onload = function () {
        var params = new URLSearchParams(window.location.search);
        var messageEl = document.getElementById("message");

        var error = params.get("error");
        if (error !== null) {
          messageEl.innerText = "Error: " + error;
          return;
        }

        var code = params.get("code");
        var state = params.get("state");
        if (code === null || state === null) {
          messageEl.innerText = "Error: missing code/state in redirect (" + params.toString() + ")";
          return;
        }

        var obsidianUri =
          "obsidian://harang-contacts-oauth?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
        window.location.href = obsidianUri;
      };
    </script>
  </head>
  <body>
    <h1>Returning to Obsidian&hellip;</h1>
    <p id="message">
      This page should redirect automatically. If nothing happens, make sure Obsidian and the harang-contacts plugin
      are installed, then try connecting your Google account again.
    </p>
  </body>
</html>
